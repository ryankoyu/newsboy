# BRIEFLY daily content pipeline — GitHub Actions schedule.
# Design: docs/design/a1-architecture.md §5-1 + design-decisions.md §3-1
# (파이프라인 실행 환경 = GitHub Actions 스케줄).
#
# All three secrets are registered (repo Settings > Secrets and variables >
# Actions), and the defaults below spend them — anthropic + supabase:
#   ANTHROPIC_API_KEY          — Anthropic API key (rewrite/extract/select calls)
#   SUPABASE_URL               — Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY  — service role key (pipeline writes bypass RLS;
#                                never the anon key — see storage/supabase.ts)
#
# A run therefore costs real money and writes real rows. To exercise the
# pipeline harmlessly, dispatch with llm_provider=mock + storage=local.

name: daily-pipeline

on:
  # OFF by operator decision (2026-08-12), until the features settle.
  #
  # The Supabase path it was originally paused for now works end to end —
  # 2026-08-12 stored 4 articles and they reached a reader through the anon
  # key. What keeps it off is different: a measured run is 8 minutes and
  # $1.53, so an unattended nightly is about $45/month, and paying that to
  # generate editions while the reader screens are still changing weekly
  # buys nothing. Turn it on when a day's output is worth keeping.
  #
  # To resume, uncomment — KST 5am = UTC 20:00 the day before (cron is UTC),
  # early enough that the night's news is collected before the morning desk.
  # schedule:
  #   - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      llm_provider:
        description: "LLM provider (anthropic requires ANTHROPIC_API_KEY secret)"
        type: choice
        options: [anthropic, mock]
        default: anthropic
      storage:
        description: "Storage backend (supabase requires SUPABASE_* secrets)"
        type: choice
        options: [supabase, local]
        default: supabase
      max_articles:
        description: "Optional cap on articles (empty = full Top 10)"
        required: false
        default: ""

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # LLM rewrite + retry loops need generous headroom (a1 §1.3)
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @supabase/realtime-js reaches for a global WebSocket,
          # which Node only provides from 22 on. On 20 the pipeline died with
          # "Node.js detected but native WebSocket not found" before it wrote
          # a single row — the first thing STORAGE=supabase ever tried to do.
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A run costs about $1.04 of Anthropic credit. Finding out afterwards
      # that a gate was broken is the expensive way to find out, so the suite
      # runs before a single API call is made.
      - name: Test
        run: npm test

      - name: Run daily pipeline
        env:
          LLM_PROVIDER: ${{ inputs.llm_provider || 'anthropic' }}
          STORAGE: ${{ inputs.storage || 'supabase' }}
          MAX_ARTICLES: ${{ inputs.max_articles }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm start

      # When STORAGE=local (mock/dry runs), keep the JSON output as a build
      # artifact so the operator can inspect 검수 대기 output without a DB.
      - name: Upload local output (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: pipeline/output/
          if-no-files-found: ignore
          retention-days: 14

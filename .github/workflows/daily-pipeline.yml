# BRIEFLY daily content pipeline — GitHub Actions schedule.
# Design: docs/design/a1-architecture.md §5-1 + design-decisions.md §3-1
# (파이프라인 실행 환경 = GitHub Actions 스케줄).
#
# Secrets referenced BY NAME ONLY — no values exist yet (task constraint).
# Before first real run, add in repo Settings > Secrets and variables > Actions:
#   ANTHROPIC_API_KEY          — Anthropic API key (rewrite/extract/select calls)
#   SUPABASE_URL               — Supabase project URL (once provisioned)
#   SUPABASE_SERVICE_ROLE_KEY  — service role key (pipeline writes bypass RLS;
#                                never the anon key — see storage/supabase.ts)
#
# Until those exist, manual runs can use llm_provider=mock + storage=local
# via workflow_dispatch inputs to exercise the pipeline harmlessly.

name: daily-pipeline

on:
  schedule:
    # KST 새벽 5시 = UTC 20:00 (전날). GitHub cron is UTC only.
    # 5am KST: 그날 아침 검수 전에 밤사이 뉴스까지 수집된 상태로 준비됨.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      llm_provider:
        description: "LLM provider (anthropic requires ANTHROPIC_API_KEY secret)"
        type: choice
        options: [anthropic, mock]
        default: anthropic
      storage:
        description: "Storage backend (supabase requires SUPABASE_* secrets)"
        type: choice
        options: [supabase, local]
        default: supabase
      max_articles:
        description: "Optional cap on articles (empty = full Top 10)"
        required: false
        default: ""

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # LLM rewrite + retry loops need generous headroom (a1 §1.3)
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run daily pipeline
        env:
          LLM_PROVIDER: ${{ inputs.llm_provider || 'anthropic' }}
          STORAGE: ${{ inputs.storage || 'supabase' }}
          MAX_ARTICLES: ${{ inputs.max_articles }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm start

      # When STORAGE=local (mock/dry runs), keep the JSON output as a build
      # artifact so the operator can inspect 검수 대기 output without a DB.
      - name: Upload local output (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: pipeline/output/
          if-no-files-found: ignore
          retention-days: 14

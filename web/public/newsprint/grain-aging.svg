<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620">
  <!-- Layer 3 of the paper surface: low-frequency browning.
       design_handoff_newsprint_skin — "Paper surface", step 3. -->
  <filter id="aging">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42
                                         0 0 0 0 0.32
                                         0 0 0 0 0.16
                                         0 0 0 -0.85 0.6"/>
  </filter>
  <rect width="620" height="620" filter="url(#aging)"/>
</svg>
